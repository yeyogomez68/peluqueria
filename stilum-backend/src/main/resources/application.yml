spring:
  application:
    name: stilum-citas

  profiles:
    active: dev

  # JPA — nunca ddl-auto=update en producción (Flyway se encarga)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway — migraciones automáticas al arrancar
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Mail (se configura por ambiente)
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Configuración de la app
stilum:
  jwt:
    secret: ${JWT_SECRET:stilum-dev-secret-key-must-be-at-least-256-bits-long-for-HS256}
    expiration-ms: 86400000  # 24 horas
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: claude-haiku-4-5-20251001
    api-url: https://api.anthropic.com/v1/messages
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:stilum-verify-2024}
