version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: stilum_postgres
    environment:
      POSTGRES_DB: stilum_citas
      POSTGRES_USER: stilum
      POSTGRES_PASSWORD: stilum_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stilum -d stilum_citas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
